name: Android paketleri üret (AAB/APK)

# Her main push'ında Android testleri ile imzalı AAB/APK artefaktları üretilir.
# Google Play yayını yalnızca workflow_dispatch + publish_to_play onayıyla yapılır.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      track:
        description: "Play Console kanalı"
        required: true
        default: production
        type: choice
        options: [internal, alpha, beta, production]
      publish_to_play:
        description: "AAB'yi Google Play'e de gönder"
        required: true
        default: false
        type: boolean

concurrency:
  group: play-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: Gerekli sırları kontrol et
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PW: ${{ secrets.ANDROID_STORE_PASSWORD }}
          PLAY_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          PUBLISH_TO_PLAY: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_to_play }}
        run: |
          missing=()
          [ -z "$KS" ] && missing+=(ANDROID_KEYSTORE_BASE64)
          [ -z "$ALIAS" ] && missing+=(ANDROID_KEY_ALIAS)
          [ -z "$KEY_PW" ] && missing+=(ANDROID_KEY_PASSWORD)
          [ -z "$STORE_PW" ] && missing+=(ANDROID_STORE_PASSWORD)
          [ "$PUBLISH_TO_PLAY" = "true" ] && [ -z "$PLAY_JSON" ] && missing+=(PLAY_STORE_SERVICE_ACCOUNT_JSON)
          if [ ${#missing[@]} -ne 0 ]; then
            echo "Eksik GitHub Actions secret(lar): ${missing[*]}"
            echo "Kurulum: docs/DEPLOY.md"
            exit 1
          fi
          if [ -n "$PLAY_JSON" ]; then
            node -e 'JSON.parse(process.env.PLAY_JSON); console.log("Play service account JSON is valid.")'
          fi

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Java kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Bağımlılıkları al
        run: flutter pub get

      - name: Keystore dosyasını geri oluştur
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.jks

      - name: key.properties oluştur
        run: |
          cat > android/key.properties <<EOF
          storeFile=release.jks
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Testleri çalıştır
        run: flutter test

      - name: AAB derle (release, imzalı)
        env:
          FAMILY_API_URL: ${{ vars.FAMILY_API_URL }}
          FAMILY_WEB_URL: ${{ vars.FAMILY_WEB_URL }}
          PGS_XP_LEADERBOARD_ID: ${{ vars.PGS_XP_LEADERBOARD_ID }}
          PGS_ACHIEVEMENT_TEN_GAMES: ${{ vars.PGS_ACHIEVEMENT_TEN_GAMES }}
          PGS_ACHIEVEMENT_FIFTY_GAMES: ${{ vars.PGS_ACHIEVEMENT_FIFTY_GAMES }}
          PGS_ACHIEVEMENT_FIVE_WINS: ${{ vars.PGS_ACHIEVEMENT_FIVE_WINS }}
          PGS_ACHIEVEMENT_TWENTY_WINS: ${{ vars.PGS_ACHIEVEMENT_TWENTY_WINS }}
          PGS_ACHIEVEMENT_WIN_STREAK_3: ${{ vars.PGS_ACHIEVEMENT_WIN_STREAK_3 }}
          PGS_ACHIEVEMENT_TRY_THEM_ALL: ${{ vars.PGS_ACHIEVEMENT_TRY_THEM_ALL }}
          PGS_ACHIEVEMENT_HUNDRED_GAMES: ${{ vars.PGS_ACHIEVEMENT_HUNDRED_GAMES }}
          PGS_ACHIEVEMENT_TEN_GAME_TYPES: ${{ vars.PGS_ACHIEVEMENT_TEN_GAME_TYPES }}
        run: |
          defines=()
          for key in FAMILY_API_URL FAMILY_WEB_URL PGS_XP_LEADERBOARD_ID \
            PGS_ACHIEVEMENT_TEN_GAMES PGS_ACHIEVEMENT_FIFTY_GAMES \
            PGS_ACHIEVEMENT_FIVE_WINS PGS_ACHIEVEMENT_TWENTY_WINS \
            PGS_ACHIEVEMENT_WIN_STREAK_3 PGS_ACHIEVEMENT_TRY_THEM_ALL \
            PGS_ACHIEVEMENT_HUNDRED_GAMES PGS_ACHIEVEMENT_TEN_GAME_TYPES; do
            if [ -n "${!key}" ]; then
              defines+=("--dart-define=$key=${!key}")
            fi
          done
          base_build_number=$(grep '^version:' pubspec.yaml | sed 's/.*+//')
          build_number=$((base_build_number + GITHUB_RUN_NUMBER))
          flutter build appbundle --release --build-number="$build_number" --target-platform android-arm,android-arm64 "${defines[@]}"
          flutter build apk --release --split-per-abi --build-number="$build_number" --target-platform android-arm,android-arm64 "${defines[@]}"

      - name: AAB imzasını doğrula
        run: |
          aab=build/app/outputs/bundle/release/app-release.aab
          jarsigner -verify -verbose -certs "$aab" > "$RUNNER_TEMP/aab-signature-check.txt" 2>&1
          if ! grep -qi 'jar verified\.' "$RUNNER_TEMP/aab-signature-check.txt"; then
            cat "$RUNNER_TEMP/aab-signature-check.txt"
            echo "AAB geçerli bir JAR imzası taşımıyor."
            exit 1
          fi
          keytool -printcert -jarfile "$aab"

      - name: İmzalı AAB'yi sakla
        uses: actions/upload-artifact@v4
        with:
          name: azoyun-signed-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: İmzalı APK'ları sakla
        uses: actions/upload-artifact@v4
        with:
          name: azoyun-signed-apks
          path: build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Geçici imzalama dosyalarını sil
        if: always()
        run: rm -f android/app/release.jks android/key.properties

      - name: Google Play'e yükle
        if: github.event_name == 'workflow_dispatch' && inputs.publish_to_play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.ferdidrgn.azgame
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          tracks: ${{ github.event.inputs.track || 'production' }}
          status: completed
