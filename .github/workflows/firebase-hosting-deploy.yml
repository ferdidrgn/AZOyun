name: CI ve web yayını

# Her push ve pull request test edilir. main'e geçen kod, testten sonra
# Firebase Hosting'e (azoyun.web.app) yayınlanır.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Aile Masası testlerini çalıştır
        run: node --test family-server/server.test.mjs family-server/progression.test.mjs

      - name: Firebase oda temizliği kurallarını test et
        run: npm --prefix functions test

      - name: Web için derle
        env:
          FAMILY_API_URL: ${{ vars.FAMILY_API_URL }}
          WEB_ADS_ENABLED: ${{ vars.WEB_ADS_ENABLED }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: node scripts/build-web.mjs

      - name: Web yayın dosyalarını doğrula
        run: node --test scripts/web-publishing.test.mjs

      - name: Web çıktısını sakla
        uses: actions/upload-artifact@v4
        with:
          name: web
          path: build/salon
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 3

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: Web çıktısını al
        uses: actions/download-artifact@v4
        with:
          name: web
          path: build/salon

      - name: Firebase sırrını kontrol et
        env:
          FIREBASE_SERVICE_ACCOUNT_AZOYUN: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AZOYUN }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_AZOYUN" ]; then
            echo "GitHub Actions secret FIREBASE_SERVICE_ACCOUNT_AZOYUN boş."
            echo "Kurulum: docs/DEPLOY.md"
            exit 1
          fi

      - name: Firebase Hosting'e yayınla
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AZOYUN }}
          projectId: azoyun-569b2
          channelId: live
