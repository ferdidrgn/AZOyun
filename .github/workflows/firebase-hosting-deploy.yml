name: CI ve web yayını

# Her push ve pull request test edilir. main'e geçen kod, testten sonra
# Firebase Hosting'e (azoyun.web.app) yayınlanır.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Bağımlılıkları al
        run: flutter pub get

      - name: Testleri çalıştır
        run: flutter test

      - name: Web için derle
        run: flutter build web --release

      - name: Web çıktısını sakla
        uses: actions/upload-artifact@v4
        with:
          name: web
          path: build/web
          if-no-files-found: error
          retention-days: 3

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: Web çıktısını al
        uses: actions/download-artifact@v4
        with:
          name: web
          path: build/web

      - name: Firebase sırrını kontrol et
        env:
          FIREBASE_SERVICE_ACCOUNT_AZOYUN: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AZOYUN }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_AZOYUN" ]; then
            echo "GitHub Actions secret FIREBASE_SERVICE_ACCOUNT_AZOYUN boş."
            echo "Kurulum: docs/DEPLOY.md"
            exit 1
          fi

      - name: Firebase Hosting'e yayınla
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AZOYUN }}
          projectId: azoyun-569b2
          channelId: live
