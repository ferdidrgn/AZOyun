name: Web'i derle ve Firebase Hosting'e yayınla

# main'e her push'ta (ör. bir PR merge edildiğinde) otomatik çalışır.
# Kurulum için tek bir manuel adım gerekiyor — bkz. docs/DEPLOY.md.
on:
  push:
    branches: [main]
  workflow_dispatch: {} # Actions sekmesinden elle de tetiklenebilir

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Bağımlılıkları al
        run: flutter pub get

      - name: Web için derle
        run: flutter build web --release

      - name: Firebase Hosting'e yayınla
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AZOYUN }}
          projectId: azoyun-569b2
          channelId: live
