<div class="screen" id="cover"><div class="eyebrow">İSTANBUL • ARCADE EDITION</div><h1 id="title">Vapur 84</h1><p id="desc"></p><button id="start"></button></div></div>
<div class="actions"><button id="up" aria-label="Up">▲</button><button id="down" aria-label="Down">▼</button><button id="pause"></button></div><p class="help" data-k="controls"></p><p class="message" id="notice" aria-live="polite"></p><details class="footer"><summary data-k="paint"></summary><form id="paintform"><label for="code" data-k="stamp"></label> <input id="code" maxlength="12" autocomplete="off" spellcheck="false"/> <button id="apply" data-k="apply"></button><output id="unlock" aria-live="polite"></output></form></details></main>
<script>
"use strict";
const el=id=>document.getElementById(id);
const copy={tr:{paint:"🎟️ Koleksiyon garajı",stamp:"Yedi bilet damgasının kodu",apply:"Uygula",gold:"Altın vapur açıldı!",wrong:"Damgaları bilet numarası sırasına göre dene.",score:"PUAN",time:"SANİYE",lives:"CAN",best:"REKOR",intro:"60 saniyede biletleri topla. Kırmızı şamandıralardan kaç. Her bilet 10 puan.",start:"İskele açıldı · Oyna",resume:"Devam et",pause:"Duraklat",paused:"Mola",finished:"Sefer tamam",wreck:"Sefer sona erdi",again:"Yeniden oyna",result:"Toplanan bilet",hit:"Şamandıra! Bir can eksildi.",controls:"Şerit seçmek için suya dokun. Klavyede ↑ ↓ veya W/S ile ilerle. Boşluk oyunu duraklatır.",more:"AZ Oyun’u keşfet ↗",tip:"Hazır olduğunda sefere devam et."},en:{paint:"🎟️ Collector’s garage",stamp:"Seven-stamp code",apply:"Apply",gold:"Gold ferry unlocked!",wrong:"Read the stamps in ticket-number order.",score:"SCORE",time:"SECONDS",lives:"LIVES",best:"BEST",intro:"Collect tickets for 60 seconds. Avoid the red buoys. Every ticket is worth 10 points.",start:"Cast off · Play",resume:"Resume",pause:"Pause",paused:"At anchor",finished:"Crossing complete",wreck:"Crossing ended",again:"Play again",result:"Tickets collected",hit:"Buoy hit! One life lost.",controls:"Tap the water to select a lane. Use ↑ ↓ or W/S on a keyboard. Space pauses the game.",more:"Explore AZ Oyun ↗",tip:"Resume when you’re ready."}};
let lang="tr",mode="ready",score=0,lives=3,best=0,left=60,lane=1,boatY=244,wait=.4,elapsed=0,last=0,frame=0,shield=0,objects=[];
const levels=[186,244,302],boatX=94;
try{best=Math.max(0,Number(localStorage.getItem("vapur84.best"))||0)}catch{}
function hud(){el("score").textContent=score;el("lives").textContent=lives;el("time").textContent=Math.ceil(left);el("best").textContent=best}
function sync(){
 const t=copy[lang];document.documentElement.lang=lang;el("lang").textContent=lang==="tr"?"English":"Türkçe";
 document.querySelectorAll("[data-k]").forEach(n=>n.textContent=t[n.dataset.k]);
 el("cover").hidden=mode==="running";el("pause").disabled=mode!=="running"&&mode!=="paused";
 el("up").disabled=el("down").disabled=mode!=="running";el("pause").textContent=mode==="paused"?t.resume:t.pause;
 el("title").textContent=mode==="over"?(lives?t.finished:t.wreck):mode==="paused"?t.paused:"Vapur 84";
 el("desc").textContent=mode==="over"?t.result+" · "+score/10:mode==="paused"?t.tip:t.intro;
 el("start").textContent=mode==="over"?t.again:mode==="paused"?t.resume:t.start;
 hud();
}
function pose(){el("player").setAttribute("transform","translate("+boatX+" "+boatY+")");el("player").setAttribute("opacity",shield>0?.55:1)}
function start(){objects=[];el("items").replaceChildren();score=0;lives=3;left=60;lane=1;boatY=levels[1];elapsed=0;shield=0;wait=.2;el("notice").textContent="";pose();run()}
function run(){mode="running";last=0;sync();el("sea").focus({preventScroll:true});frame=requestAnimationFrame(tick)}
function togglePause(){if(mode==="paused"){run()}else{pause()}}
function pause(){if(mode!=="running")return;mode="paused";cancelAnimationFrame(frame);sync()}
function finish(){mode="over";if(score>best){best=score;try{localStorage.setItem("vapur84.best",String(score))}catch{}}el("notice").textContent="";sync()}
function spawn(){const kind=Math.random()<.62?"ticket":"buoy",row=Math.floor(Math.random()*3);const node=document.createElementNS("http://www.w3.org/2000/svg","use");node.setAttribute("href","#"+kind);el("items").append(node);objects.push({x:790,row,kind,node})}
function tick(now){if(mode!=="running")return;const dt=last?Math.max(0,(now-last)/1000):0;last=now;if(dt>.35){pause();return}elapsed+=dt;left=Math.max(0,60-elapsed);shield=Math.max(0,shield-dt);boatY+=(levels[lane]-boatY)*Math.min(1,dt*15);pose();wait-=dt;if(wait<=0){spawn();wait=.94-.0025*elapsed}
 for(let i=objects.length-1;i>=0;i--){const o=objects[i];o.x-=dt*(190+elapsed*2);o.node.setAttribute("transform","translate("+o.x+" "+levels[o.row]+")");const collides=Math.abs(o.x-boatX)<43&&Math.abs(levels[o.row]-boatY)<25;if(collides||o.x< -30){if(collides){if(o.kind==="ticket"){score+=10}else if(!shield){lives--;shield=.8;el("notice").textContent=copy[lang].hit}}o.node.remove();objects.splice(i,1)}}
 hud();if(left<=0||lives<=0){finish();return}frame=requestAnimationFrame(tick)}
function move(by){if(mode==="running")lane=Math.min(2,Math.max(0,lane+by))}
el("start").onclick=()=>mode==="paused"?run():start();el("pause").onclick=togglePause;el("up").onclick=()=>move(-1);el("down").onclick=()=>move(1);el("lang").onclick=()=>{lang=lang==="tr"?"en":"tr";el("notice").textContent="";sync()};
el("sea").addEventListener("pointerdown",e=>{if(mode!=="running")return;const p=new DOMPoint(e.clientX,e.clientY).matrixTransform(el("sea").getScreenCTM().inverse());lane=levels.reduce((best,_,i)=>Math.abs(levels[i]-p.y)<Math.abs(levels[best]-p.y)?i:best,0)});
document.addEventListener("keydown",e=>{if(e.target.tagName==="INPUT")return;if(mode==="running"&&["ArrowUp","ArrowDown","w","W","s","S"].includes(e.key)){e.preventDefault();move(["ArrowUp","w","W"].includes(e.key)?-1:1)}else if(e.code==="Space"&&!e.repeat&&e.target.tagName!=="BUTTON"&&["running","paused"].includes(mode)){e.preventDefault();togglePause()}});
function gild(){el("player").querySelectorAll('[fill="#f7e5b9"],[fill="#ece5d4"]').forEach(n=>n.setAttribute("fill","#ffcf55"));el("player").querySelector('[fill="#f07857"]')?.setAttribute("fill","#de9d28")}
try{if(localStorage.getItem("vapur84.gold")==="1")gild()}catch{}
el("paintform").onsubmit=e=>{e.preventDefault();const ok=el("code").value.trim().toUpperCase()==="FERRY84";el("unlock").textContent=ok?copy[lang].gold:copy[lang].wrong;if(ok){gild();try{localStorage.setItem("vapur84.gold","1")}catch{}}};
document.addEventListener("visibilitychange",()=>{if(document.hidden&&mode==="running")pause()});pose();sync();
</script></body></html>
