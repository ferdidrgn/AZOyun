name: AZOyun
description: Çok oyunculu (multiplayer) oyun platformu
publish_to: 'none'
version: 1.0.0+4

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core:     ^3.0.0
  firebase_database: ^11.0.0

  # Secure storage
  flutter_secure_storage: ^9.2.2

  # Ads
  google_mobile_ads: ^5.1.0

  # Uygulama içi satın alma (reklamsız, coin paketleri, destek ol)
  in_app_purchase: ^3.2.0

  # Google Play Games Services (giriş, liderlik tablosu, başarımlar, bulut kayıt)
  games_services: ^4.1.1

  # Hızlı oyunlar için yerel profil/XP/liderlik depolama
  shared_preferences: ^2.3.3

  # Animations
  flutter_animate: ^4.5.0

  # Utils
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/
    - assets/images/
