name: AZOyun
description: Çok oyunculu (multiplayer) oyun platformu
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core:     ^3.0.0
  firebase_database: ^11.0.0

  # Secure storage
  flutter_secure_storage: ^9.2.2

  # Ads
  google_mobile_ads: ^5.1.0

  # Physics game engine (Mini Golf & Soccer canvas)
  # flame and flame_forge2d only needed for the Flame-based soccer demo.
  # The custom-painter soccer/golf screens don't need it.
  # Keep only if you keep the Flame soccer game variant.
  # flame: ^1.34.0

  # Haptics
  # vibration: ^2.0.1   # optional — replaced by HapticFeedback from flutter

  # Animations
  flutter_animate: ^4.5.0

  # Utils
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/
    - assets/images/
